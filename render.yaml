services:
  - type: web
    name: thermal-casting-api
    runtime: python
    plan: free

    rootDir: backend

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      uvicorn server:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: AI_ENABLED
        value: "false"
